name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ./environment_dev
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environment_dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environment_dev
        run: terraform plan -var-file=terraform.ci.tfvars -input=false


  terraform-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    needs: terraform-plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Terraform Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./environment_dev
          severity: HIGH,CRITICAL
          exit-code: 1


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan
      - terraform-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: terraform-apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ./environment_dev
        run: terraform init

      - name: Terraform Apply
        working-directory: ./environment_dev
        run: terraform apply -var-file=terraform.ci.tfvars -auto-approve